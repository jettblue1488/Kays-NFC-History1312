name: Build and publish Kay's NFC History APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
      - name: Restore debug signing key for consistent personal-test builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nfc-history-v2-debug-keystore-v1
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kays-NFC-History-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK on GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.3.0" >/dev/null 2>&1; then
            gh release upload "v1.3.0" "app/build/outputs/apk/debug/app-debug.apk" --clobber
          else
            gh release create "v1.3.0" "app/build/outputs/apk/debug/app-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "Kay's NFC History 2 — NDEF Copy & Write" \
              --notes "Adds standard NDEF tag copy and write with capacity checks and confirmation. Does not clone protected cards, tag UIDs or payment credentials. Offline Android app."
          fi
