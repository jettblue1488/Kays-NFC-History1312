name: Build and publish Kay's NFC History APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kays-NFC-History-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK on GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.1.0" >/dev/null 2>&1; then
            gh release upload "v1.1.0" "app/build/outputs/apk/debug/app-debug.apk" --clobber
          else
            gh release create "v1.1.0" "app/build/outputs/apk/debug/app-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "Kay's NFC History v1.1.0" \
              --notes "Offline Android NFC tag history app. Supports automatic tag dispatch while the phone is unlocked and Android selects the app, as well as foreground scanning. NFC detection is normally unavailable while the screen is off or the phone is locked. This is a personal-use debug-signed APK, not a Google Play production release."
          fi
