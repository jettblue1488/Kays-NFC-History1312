plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kays.nfchistory'
    compileSdk 35

    defaultConfig {
        // Different Android application ID allows installation beside the
        // original app even when GitHub Actions used a different signing key.
        applicationId 'com.kays.nfchistory.v2'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
